<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | by pxlpuff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-contact">

  <header class="site-header d-flex align-items-center justify-content-between">
    <a href="index.html" class="logo" aria-label="by pxlpuff home">
      <span class="logo-placeholder"></span>
    </a>
    <nav class="d-flex">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>

    <section class="contact-band">
      <h1>Connect With Our World! ✦</h1>
      <p>Have any questions? Feel free to drop us a message!</p>
    </section>

    <nav class="contact-list" aria-label="Contact channels">
      <a href="#" class="d-flex align-items-center">
        <span class="icon"><img src="images/icon-facebook.png" alt=""></span>
        Facebook
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg>
      </a>
      <a href="#" class="d-flex align-items-center">
        <span class="icon"><img src="images/icon-instagram.png" alt=""></span>
        Instagram
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg>
      </a>
      <a href="#" class="d-flex align-items-center">
        <span class="icon"><img src="images/icon-email.png" alt=""></span>
        Email
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg>
      </a>
    </nav>

    <section class="newsletter">
      <h2>Join The Pixel Club! ♡</h2>
      <p>Get a little pixel magic straight to your inbox.</p>
    </section>

      <form class="subscribe" id="subscribeForm">
      <input class="form-control" type="email" name="email" placeholder="Enter your email address" aria-label="Email address">
      <button type="submit" class="btn btn-figma blue">Subscribe</button>
    </form>

<section class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

      <h2 class="text-center mb-4">Send Us a Message ♡</h2>

     <form id="contactForm" action="#">

        <div class="mb-3">
          <label for="contactName" class="form-label">
            Full Name
          </label>
          <input
            type="text"
            class="form-control"
            id="contactName"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required>
        </div>

        <div class="mb-3">
          <label for="contactEmail" class="form-label">
            Email Address
          </label>
          <input
            type="email"
            class="form-control"
            id="contactEmail"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required>
        </div>

        <div class="mb-3">
          <label for="contactSubject" class="form-label">
            Subject
          </label>
          <input
            type="text"
            class="form-control"
            id="contactSubject"
            name="subject"
            placeholder="What is your inquiry about?"
            required>
        </div>

        <div class="mb-3">
          <label for="contactMessage" class="form-label">
            Message
          </label>
          <textarea
            class="form-control"
            id="contactMessage"
            name="message"
            rows="5"
            placeholder="Write your message here..."
            required></textarea>
        </div>

        <button type="submit" class="btn btn-figma w-100">
          Send Message
        </button>

      </form>

    </div>
  </div>
</section>

  </main>

  <footer class="site-footer d-flex align-items-center justify-content-between">
    <span class="footer-logo" role="img" aria-label="by pxlpuff"></span>
    <div class="footer-links d-flex flex-column">
      <a href="privacy-policy.html" class="page-link">Privacy Policy</a>
      <span class="page-link">Copyright</span>
    </div>
  </footer>

<script>
  // ======================================
  // CONTACT FORM - METHOD #2
  // ======================================

  const TO_ADDRESS = "hello@examplewebsite142.com";

  document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("contactName").value.trim();
    const email = document.getElementById("contactEmail").value.trim();
    const topic = document.getElementById("contactSubject").value.trim();
    const message = document.getElementById("contactMessage").value.trim();

    const subject = "Website message: " + topic;

    const body =
      "Hello, by pxlpuff!\r\n\r\n" +
      "Name: " + name + "\r\n" +
      "Email: " + email + "\r\n\r\n" +
      message;

    const mailto = "mailto:" + TO_ADDRESS +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);

    window.location.href = mailto;
  });


  // ======================================
  // NEWSLETTER SUBSCRIPTION
  // ======================================

  document.getElementById("subscribeForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const emailInput = this.querySelector('input[name="email"]');
    const email = emailInput.value.trim();

    if (!emailInput.checkValidity() || email === "") {
      alert("Please enter a valid email address.");
      emailInput.focus();
      return;
    }

    const recipient = "hello@examplewebsite142.com";
    const subject = "Pixel Club Newsletter Subscription";

    const body =
      "Hello by pxlpuff!\r\n\r\n" +
      "I would like to subscribe to the Pixel Club newsletter.\r\n\r\n" +
      "My email address: " + email;

    const mailto = "mailto:" + recipient +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);

    window.location.href = mailto;
  });

</script>

<script src="js/main.js"></script>
</body>
</html>
