<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | by pxlpuff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-contact">

  <header class="site-header">
    <a href="index.html" class="logo" aria-label="by pxlpuff home">
      <span class="logo-placeholder"></span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>

    <section class="contact-band">
      <h1>Connect With Our World! ✦</h1>
      <p>Have any questions? Feel free to drop us a message!</p>
    </section>

    <nav class="contact-list" aria-label="Contact channels">
      <a href="#">
        <span class="icon"><img src="images/icon-facebook.png" alt=""></span>
        Facebook
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg>
      </a>
      <a href="#">
        <span class="icon"><img src="images/icon-instagram.png" alt=""></span>
        Instagram
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg>
      </a>
      <a href="#">
        <span class="icon"><img src="images/icon-email.png" alt=""></span>
        Email
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11"/></svg>
      </a>
    </nav>

    <section class="newsletter">
      <h2>Join The Pixel Club! ♡</h2>
      <p>Get a little pixel magic straight to your inbox.</p>
    </section>

    <form class="subscribe" action="#" method="post">
      <input type="email" name="email" placeholder="Enter your email address" aria-label="Email address">
      <button type="submit">Subscribe</button>
    </form>

  </main>

  <footer class="site-footer">
    <span class="footer-logo"></span>
    <div class="footer-links">
      <a href="privacy-policy.html" class="page-link">Privacy Policy</a>
      <span class="page-link">Copyright</span>
    </div>
  </footer>

</body>
</html>
