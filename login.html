<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | by pxlpuff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-login">

  <header class="site-header">
    <a href="index.html" class="logo" aria-label="by pxlpuff home">
      <span class="logo-placeholder"></span>
    </a>
    <div class="header-icons">
      <a href="search.html" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </a>
      <a href="wishlist.html" aria-label="Wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
      </a>
      <a href="cart.html" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
      </a>
      <a href="login.html" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </a>
    </div>
  </header>

  <main>
    <form class="auth-card" action="#" method="post">
      <h1>Login</h1>

      <div class="field">
        <label for="login-email">Email address</label>
        <input id="login-email" type="email" placeholder="example@gmail.com">
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Enter your password">
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <div class="auth-actions">
        <a href="#" class="btn-auth primary">Log In</a>
        <a href="register.html" class="btn-auth dark">Sign Up</a>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <span class="footer-logo"></span>
    <div class="footer-links">
      <a href="privacy-policy.html" class="page-link">Privacy Policy</a>
      <span class="page-link">Copyright</span>
    </div>
  </footer>

</body>
</html>
