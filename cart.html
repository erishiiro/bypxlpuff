<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | by pxlpuff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .cart-item-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 4px;
    }
    .quantity-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      text-decoration: underline;
    }
    .remove-btn:hover {
      color: #e63946;
    }
  </style>
</head>
<body>

<header class="site-header d-flex align-items-center justify-content-between">
  <a href="index.html" class="logo" aria-label="by pxlpuff home">
    <span class="logo-placeholder"></span>
  </a>
  <div class="header-icons d-flex align-items-center">
    <a href="search.html" aria-label="Search">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </a>
    <a href="wishlist.html" aria-label="Wishlist">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
      <span class="wishlist-count" style="display:none; position:absolute; top:-8px; right:-8px; background:var(--burgundy); color:white; font-size:10px; min-width:18px; height:18px; border-radius:50%; align-items:center; justify-content:center; font-weight:600;">0</span>
    </a>
    <a href="cart.html" aria-label="Cart" style="position:relative;">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
      <span class="cart-counter" style="position:absolute; top:-8px; right:-8px; background:var(--burgundy); color:white; font-size:10px; min-width:18px; height:18px; border-radius:50%; display:none; align-items:center; justify-content:center; font-weight:600;">0</span>
    </a>
    <a href="login.html" aria-label="Menu">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </a>
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="container py-5">
  <h1 class="mb-4">Your Shopping Cart</h1>

  <!-- EMPTY CART MESSAGE -->
  <div id="empty-cart" class="text-center py-5">
    <h3>Your cart is empty</h3>
    <p class="text-muted">Looks like you haven't added anything yet.</p>
    <a href="shop.html" class="btn" style="background: var(--burgundy); color: #fff;">Go to Shop</a>
  </div>

  <!-- CART ITEMS CONTAINER -->
  <div id="cart-items" class="row gy-4"></div>

  <!-- CART SUMMARY -->
  <div id="cart-summary" class="row mt-5" style="display: none;">
    <div class="col-md-6 offset-md-6">
      <div class="border p-4 rounded">
        <h4 class="mb-3">Order Summary</h4>
        <div class="d-flex justify-content-between mb-2">
          <span>Subtotal</span>
          <span id="subtotal-price">₱ 0</span>
        </div>
        <div class="d-flex justify-content-between mb-3 text-muted">
          <span>Shipping</span>
          <span>Calculated at checkout</span>
        </div>
        <hr>
        <div class="d-flex justify-content-between mb-4 fw-bold">
          <span>Total</span>
          <span id="total-price">₱ 0</span>
        </div>
        <button class="btn w-100" style="background-color: #800020; border-color: #800020; color: #fff;">Proceed to Checkout</button>
      </div>
    </div>
  </div>
</main>

<!-- HAMBURGER BUTTON -->
<button class="hamburger-btn menu-toggle" aria-label="Toggle menu" aria-expanded="false">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- MENU -->
<nav class="hamburger-menu mobile-nav menu">
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="wishlist.html">Wishlist</a>
  <a href="cart.html">Cart</a>
  <a href="contact.html">Contact Us</a>
  <a href="privacy-policy.html">Privacy Policy</a>
</nav>


<footer class="site-footer d-flex align-items-center justify-content-between mt-5 py-3">
  <span class="footer-logo" role="img" aria-label="by pxlpuff"></span>
  <div class="footer-links d-flex flex-column">
    <a href="privacy-policy.html" class="page-link">Privacy Policy</a>
    <span class="page-link">Copyright</span>
  </div>
</footer>

<script src="js/main.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const CART_KEY = 'pxlpuff_cart';
  
  function getCart() {
    return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
  }
  
  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    updateCartCounter();
    renderCart();
  }
  
  function updateCartCounter() {
    const cart = getCart();
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.querySelectorAll('.cart-counter').forEach(el => {
      el.textContent = total;
      el.style.display = total > 0 ? 'inline-flex' : 'none';
    });
  }
  
  function renderCart() {
    const cart = getCart();
    const emptyMsg = document.getElementById('empty-cart');
    const itemsContainer = document.getElementById('cart-items');
    const summary = document.getElementById('cart-summary');
    
    // Clear old items
    itemsContainer.innerHTML = '';
    
    if (cart.length === 0) {
      emptyMsg.style.display = 'block';
      summary.style.display = 'none';
      return;
    }
    
    // Has items — hide empty message
    emptyMsg.style.display = 'none';
    summary.style.display = 'flex';
    
    let subtotal = 0;
    
    // Render each item
    cart.forEach((item, index) => {
      subtotal += item.price * item.quantity;
      
      const itemEl = document.createElement('div');
      itemEl.className = 'col-12';
      itemEl.innerHTML = `
        <div class="d-flex align-items-center gap-3 p-3 border rounded">
          <img src="${item.image}" alt="${item.name}" class="cart-item-img">
          <div class="flex-grow-1">
            <h5 class="mb-1">${item.name}</h5>
            <p class="mb-1 text-muted small">Color: ${item.color} · Size: ${item.size}</p>
            <p class="fw-bold mb-0">₱ ${item.price}</p>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button class="quantity-btn qty-minus" data-index="${index}">−</button>
            <span class="px-2">${item.quantity}</span>
            <button class="quantity-btn qty-plus" data-index="${index}">+</button>
          </div>
          <button class="remove-btn" data-index="${index}">Remove</button>
        </div>
      `;
      itemsContainer.appendChild(itemEl);
    });
    
    // Update totals
    document.getElementById('subtotal-price').textContent = '₱ ' + subtotal;
    document.getElementById('total-price').textContent = '₱ ' + subtotal;
    
    // Attach quantity buttons
    document.querySelectorAll('.qty-minus').forEach(btn => {
      btn.addEventListener('click', function() {
        const idx = parseInt(this.getAttribute('data-index'));
        const cart = getCart();
        if (cart[idx].quantity > 1) {
          cart[idx].quantity--;
          saveCart(cart);
        }
      });
    });
    
    document.querySelectorAll('.qty-plus').forEach(btn => {
      btn.addEventListener('click', function() {
        const idx = parseInt(this.getAttribute('data-index'));
        const cart = getCart();
        cart[idx].quantity++;
        saveCart(cart);
      });
    });
    
    // Attach remove buttons
    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const idx = parseInt(this.getAttribute('data-index'));
        const cart = getCart();
        cart.splice(idx, 1);
        saveCart(cart);
      });
    });
  }
  
  // Initialize
  updateCartCounter();
  renderCart();
});
</script>

</body>
</html>
