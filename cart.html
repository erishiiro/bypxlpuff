<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | by pxlpuff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<header class="site-header d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo" aria-label="by pxlpuff home">
            <span class="logo-placeholder"></span>
        </a>
        <div class="header-icons d-flex align-items-center">
            <a href="search.html" aria-label="Search">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            </a>
            <a href="wishlist.html" aria-label="Wishlist">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
            </a>
            <a href="cart.html" aria-label="Cart">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
            </a>
            <a href="login.html" aria-label="Menu">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </a>
        </div>
    </header>

<!-- MAIN CONTENT -->
<main class="container py-5">
  <h1 class="mb-4">Your Shopping Cart</h1>

  <!-- EMPTY CART MESSAGE -->
  <div id="empty-cart" class="text-center py-5">
    <h3>Your cart is empty</h3>
    <p class="text-muted">Looks like you haven't added anything yet.</p>
    <a href="shop.html" class="btn btn-dark mt-2">Go to Shop</a>
  </div>

  <!-- CART ITEMS CONTAINER — JavaScript puts items HERE -->
  <div id="cart-items" class="row gy-4 d-none"></div>

  <!-- CART SUMMARY -->
  <div id="cart-summary" class="row mt-5 d-none">
    <div class="col-md-6 offset-md-6">
      <div class="border p-4 rounded">
        <h4 class="mb-3">Order Summary</h4>
        <div class="d-flex justify-content-between mb-2">
          <span>Subtotal</span>
          <span id="subtotal-price">₱ 0</span>
        </div>
        <div class="d-flex justify-content-between mb-3 text-muted">
          <span>Shipping</span>
          <span>Calculated at checkout</span>
        </div>
        <hr>
        <div class="d-flex justify-content-between mb-4 fw-bold">
          <span>Total</span>
          <span id="total-price">₱ 0</span>
        </div>
        <button class="btn w-100" style="background-color: #800020; border-color: #800020; color: #fff;">Proceed to Checkout</button>

      </div>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
</body>
</html>
