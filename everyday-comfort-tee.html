<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everyday Comfort Tee | by pxlpuff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .size-btn {
      border: 2px solid #ccc;
      background-color: #fff;
      color: #000;
      padding: 8px 14px;
      cursor: pointer;
      margin-right: 8px;
    }

    }

</head>
<body class="page-product">

<header class="site-header d-flex align-items-center justify-content-between">
  <a href="index.html" class="logo" aria-label="by pxlpuff home">
    <span class="logo-placeholder"></span>
  </a>
  <div class="header-icons d-flex align-items-center">
    <a href="search.html" aria-label="Search">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </a>
    <a href="wishlist.html" aria-label="Wishlist">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
    </a>
    <a href="cart.html" aria-label="Cart" style="position: relative;">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
      <span class="cart-counter" style="position: absolute; top: -8px; right: -8px; background: var(--burgundy); color: white; font-size: 10px; min-width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 600;">0</span>
    </a>
    <a href="menu.html" aria-label="Menu">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </a>
  </div>
</header>

<main>
  <nav class="breadcrumb d-flex align-items-center" aria-label="Breadcrumb">
    <a href="shop.html">Shop</a>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    <span>Shirts</span>
  </nav>

  <section class="product-detail d-flex align-items-start">
    <div class="thumbs d-flex flex-column">
      <img class="thumb" src="images/products/everyday-comfort-tee-thumb-1.png" alt="Everyday Comfort Tee, front view">
      <img class="thumb" src="images/products/everyday-comfort-tee-thumb-2.png" alt="Everyday Comfort Tee, back view">
    </div>
    <div id="main-product-image" style="width:300px;height:375px;">
      <img src="images/products/everyday-comfort-tee-main.png" alt="Everyday Comfort Tee - Light Gray" style="width:100%;height:100%;object-fit:cover;">
    </div>

    <div class="info">
      <h1>Everyday Comfort Tee</h1>
      <p class="price">₱ 499</p>
      <p class="meta brand d-flex align-items-center"><strong>BRAND:</strong><span>by pxlpuff</span></p>

      <!-- COLOR SELECTION -->
      <p style="margin-bottom: 8px;"><strong>COLOUR:</strong></p>
      <div id="color-picker" style="display: flex; gap: 12px;">
        <button
          type="button"
          data-color="Light Gray"
          data-image="images/products/everyday-comfort-tee-main.png"
          data-thumb-1="images/products/everyday-comfort-tee-thumb-1.png"
          data-thumb-2="images/products/everyday-comfort-tee-thumb-2.png"
          style="width: 26px; height: 26px; border-radius: 50%; background: #E2E2E2; border: 3px solid #000; cursor: pointer; padding: 0;"
        ></button>
        <button
          type="button"
          data-color="Sage"
          data-image="images/products/shop-everyday-comfort-tee-sage.png"
          data-thumb-1="images/products/everyday-comfort-tee-thumb-1-sage.png"
          data-thumb-2="images/products/everyday-comfort-tee-thumb-2-sage.png"
          style="width: 26px; height: 26px; border-radius: 50%; background: #A8B89A; border: 3px solid #ccc; cursor: pointer; padding: 0;"
        ></button>
      </div>

      <!-- SIZE -->
      <p style="margin: 16px 0 8px;"><strong>SIZE:</strong></p>
      <div class="size-options">
        <button class="size-btn selected" data-size="S">S</button>
        <button class="size-btn" data-size="M">M</button>
        <button class="size-btn" data-size="L">L</button>
        <button class="size-btn" data-size="XL">XL</button>
      </div>

      <!-- QUANTITY -->
      <div class="quantity-wrapper" style="margin: 16px 0;">
        <button class="quantity-btn qty-minus">−</button>
        <span class="quantity-value">1</span>
        <button class="quantity-btn qty-plus">+</button>
      </div>

      <!-- BUTTONS -->
      <div class="action-buttons">
        <button class="add-to-cart-btn" onclick="
          if (!selectedColor) { alert('Select a color first!'); return; }
          if (!selectedSize) { alert('Select a size first!'); return; }
          addToCart('everyday-comfort-tee', 'Everyday Comfort Tee', 499, selectedColor, selectedSize, currentImageSrc);
          alert('✅ Added to cart!');
        ">
          🛒 Add to Cart
        </button>
        <button class="order-now-btn" type="button" onclick="
  if (!selectedColor) { alert('Select a color first!'); return false; }
  if (!selectedSize) { alert('Select a size first!'); return false; }

  const productName = 'Everyday Comfort Tee';
  const emailTo = 'orders@examplewebsite142.com';
  const price = 499;
  const total = price * quantity;
  const BR = '%0D%0A';

  const emailBody = 
    'Hello by pxlpuff Team,' + BR + BR +
    'I would like to order the following item:' + BR + BR +
    '----------------------------------------' + BR +
    'Product: ' + productName + BR +
    'Color: ' + selectedColor + BR +
    'Size: ' + selectedSize + BR +
    'Quantity: ' + quantity + BR +
    'Price: ₱' + price + ' each' + BR +
    'Total: ₱' + total + BR +
    '----------------------------------------' + BR + BR +
    'Thank you!' + BR + BR +
    'Your Name: ' + BR +
    'Contact Number: ' + BR +
    'Delivery Address: ';

  const subject = encodeURIComponent('New Order — ' + productName);
  window.open('https://mail.google.com/mail/?view=cm&to=' + emailTo + '&su=' + subject + '&body=' + emailBody, '_blank');
  return false;
">
  ✨ Order Now
</button>


      </div>

      <!-- ❤️ WISHLIST -->
      <button type="button" id="wish-button" data-id="everyday-comfort-tee" style="display: inline-flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; font-size: 15px; color: inherit; padding: 8px 0;">
        <span id="heart-icon" style="font-size: 20px; color: inherit;">♡</span>
        <span id="wish-text">Add to Wishlist</span>
      </button>

      <div class="description">
        <h4>Description:</h4>
        <p>Your new everyday favorite — soft, breathable, and made to feel like a hug. Simple, cozy, and designed for comfort all day long.</p>
      </div>
    </div>
  </section>
</main>
<!-- HAMBURGER BUTTON -->
<button class="hamburger-btn menu-toggle" aria-label="Toggle menu" aria-expanded="false">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- MENU -->
<nav class="hamburger-menu mobile-nav menu">
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="wishlist.html">Wishlist</a>
  <a href="cart.html">Cart</a>
  <a href="contact.html">Contact Us</a>
  <a href="privacy-policy.html">Privacy Policy</a>
</nav>


<footer class="site-footer d-flex align-items-center justify-content-between">
  <span class="footer-logo" role="img" aria-label="by pxlpuff"></span>
  <div class="footer-links d-flex flex-column">
    <a href="privacy-policy.html" class="page-link">Privacy Policy</a>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/color-picker.js"></script>

<script>
// ===== GLOBAL VARIABLES =====
var selectedColor = 'Light Gray';
var selectedSize = 'S';
var quantity = 1;
var currentImageSrc = 'images/products/everyday-comfort-tee-main.png';

document.addEventListener('DOMContentLoaded', function() {

  // ===== SIZE BUTTONS =====
  const sizeButtons = document.querySelectorAll('.size-btn');
  sizeButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      sizeButtons.forEach(b => b.classList.remove('selected'));
      this.classList.add('selected');
      selectedSize = this.getAttribute('data-size');
    });
  });

  // ===== QUANTITY BUTTONS =====
  const minusBtn = document.querySelector('.qty-minus');
  const plusBtn = document.querySelector('.qty-plus');
  const qtyValue = document.querySelector('.quantity-value');

  if (minusBtn) {
    minusBtn.addEventListener('click', function() {
      if (quantity > 1) {
        quantity--;
        qtyValue.textContent = quantity;
      }
    });
  }
  if (plusBtn) {
    plusBtn.addEventListener('click', function() {
      quantity++;
      qtyValue.textContent = quantity;
    });
  }

  // ===== WISHLIST TOGGLE =====
  const wishBtn = document.getElementById('wish-button');
  const heartIcon = document.getElementById('heart-icon');
  const wishText = document.getElementById('wish-text');
  const productId = wishBtn.getAttribute('data-id');
  
  let wishlist = JSON.parse(localStorage.getItem('pxlpuff_wishlist') || '[]');
  let isWished = wishlist.includes(productId);
  
  function updateWishlistUI() {
    if (isWished) {
      heartIcon.textContent = '♥';
      heartIcon.style.color = '#800020';
      wishText.textContent = 'In Wishlist';
    } else {
      heartIcon.textContent = '♡';
      heartIcon.style.color = 'inherit';
      wishText.textContent = 'Add to Wishlist';
    }
  }
  
  updateWishlistUI();
  
  wishBtn.addEventListener('click', function() {
    isWished = !isWished;
    if (isWished) {
      if (!wishlist.includes(productId)) wishlist.push(productId);
    } else {
      wishlist = wishlist.filter(id => id !== productId);
    }
    localStorage.setItem('pxlpuff_wishlist', JSON.stringify(wishlist));
    updateWishlistUI();
  });
});

// ===== 5. ADD TO CART =====
function addToCart(productId, name, price, color, size, imageSrc) {
  if (!color) { alert('⚠️ Select a color first!'); return; }
  if (!size) { alert('⚠️ Select a size first!'); return; }

  const cart = JSON.parse(localStorage.getItem('pxlpuff_cart') || '[]');
  const uniqueKey = `${productId}-${color}-${size}`;
  const existingIndex = cart.findIndex(item => item.key === uniqueKey);

  if (existingIndex !== -1) {
    cart[existingIndex].quantity += quantity;
  } else {
    cart.push({
      key: uniqueKey,
      name: name,
      price: price,
      color: color,
      size: size,
      quantity: quantity,
      image: imageSrc
    });
  }

  localStorage.setItem('pxlpuff_cart', JSON.stringify(cart));
  
  const counter = document.querySelector('.cart-counter');
  if (counter) {
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    counter.textContent = total;
    counter.style.display = total > 0 ? 'flex' : 'none';
  }

  alert(`✅ Added to cart!\n\nItem: ${name}\nColor: ${color}\nSize: ${size}\nQty: ${quantity}`);
}
</script>

</body>
</html>
